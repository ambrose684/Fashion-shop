<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ shop_name }}</title>
<style>
:root{--ink:#1e1b1a;--muted:#77716e;--line:#e9e4e1;--accent:#8b3153;--soft:#f8f2f4}
*{box-sizing:border-box}body{margin:0;background:#fffdfc;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
header{padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--line)}
.brand{font-family:Georgia,serif;font-size:1.45rem;font-weight:bold;letter-spacing:.04em;color:var(--accent);text-decoration:none}
nav a{color:var(--ink);text-decoration:none;margin-left:16px;font-weight:600}
main{max-width:1120px;margin:auto;padding:26px 5% 54px}
.hero{background:linear-gradient(120deg,#f8e9ef,#f8f3ee);border-radius:18px;padding:30px;margin-bottom:26px}
.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:.75rem;font-weight:bold;color:var(--accent)}
h1{font: bold clamp(2rem,5vw,3.3rem) Georgia,serif;line-height:1.1;margin:10px 0}
h2{font-family:Georgia,serif}p{line-height:1.55}.muted{color:var(--muted)}
input,select,textarea,button,.button{font:inherit;padding:12px;border:1px solid #d8cfcb;border-radius:9px}
input,select,textarea{width:100%;background:white}
button,.button{background:var(--accent);color:white;border:0;text-decoration:none;display:inline-block;font-weight:bold;cursor:pointer;text-align:center}
.search{display:flex;gap:8px;max-width:580px;margin-top:18px}.search input{flex:1;min-width:0}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px}.filters a{border:1px solid var(--line);padding:9px 13px;border-radius:20px;text-decoration:none;color:var(--ink)}.filters a.active{background:var(--accent);color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}
.card{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:white}
.card img{width:100%;height:220px;object-fit:cover;background:#f4eeeb}
.placeholder{height:220px;display:grid;place-items:center;background:#f6eff1;font-size:3rem}
.cardbody{padding:15px}.tag{font-size:.75rem;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
.card h2{font-size:1.15rem;margin:7px 0}.price{font-size:1.1rem;font-weight:bold;color:var(--accent);margin:9px 0 13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.actions a{flex:1}
.formbox{max-width:720px;padding:22px;border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:24px}
label{display:block;font-weight:bold;margin:13px 0 6px}.notice{background:#fff0d7;padding:12px;border-radius:9px;margin:10px 0}
footer{text-align:center;border-top:1px solid var(--line);padding:24px;color:var(--muted)}
@media(max-width:480px){.search{flex-direction:column}.card img,.placeholder{height:180px}}
</style></head><body>
<header><a class="brand" href="{{ url_for('index') }}">FASHION SHOP</a><nav><a href="{{ url_for('index') }}">Shop</a><a href="{{ url_for('admin') }}">Manage products</a></nav></header>
<main>{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="notice">{{ m }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main>
<footer>FASHION SHOP · Style your way</footer></body></html>
